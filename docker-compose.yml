version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crop_disease_backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/checkpoints/crop_disease_model.onnx
    volumes:
      - ./checkpoints:/app/checkpoints
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: crop_disease_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: always
